version: '3.8'

services:
  backend:
    build: ./backend
    container_name: taskmanager-backend
    ports:
      - "8000:8000"
    volumes:
      - db-data:/app/data
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: taskmanager-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  db-data:

networks:
  app-network:
    driver: bridge
