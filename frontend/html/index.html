<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Dos - Task Manager</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/frontend/css/reset.css">
    <link rel="stylesheet" href="/frontend/css/style.css">

    <link rel="icon" href="/frontend/resources/icons/appicon.ico">
</head>
<body>
    <div class="content-wrapper">
        <header>
            <div><img class="logo" src="/frontend/resources/images/logo.png"></div>
                <div class="balance-log-btns">
                    <button class="button"> 238 <img src="/frontend/resources/icons/money-bill-coin.svg"></button>
                    <button class="button audit">Audit Log <img src="/frontend/resources/icons/database.svg"></button>
                </div>
                <div class="pfp-username">
                    <div class="username">Simone</div>
                    <img class="pfp" src="/frontend/resources/images/pfp_placeholder.png">
                </div>
        </header>

        <div class="main-section">
            <div class="search-and-filter-section">
                <div class="search-bar-container">                
                    <img src="/frontend//resources/icons/search.svg">
                    <textarea maxlength="55" rows="1"   placeholder="Search task..."class="search-bar"></textarea>
                </div>
                <button class="button add-new-task"> Add New Task <img src="/frontend/resources/icons/add-new-task.svg"></button>
            </div>
            <div class="tasks-board">
            </div>
        </div>
    </div>
    <div class="overlay"></div>
    <dialog id="edit-modal">
        <div class="modal-content">
            <div class="modal-top-frame">
                <div class="modal-priority-state-frame">
                    <div class="modal-state">
                        <div class="state To-Do inactive" style="font-size: 16px;">To-Do</div>
                        <div class="state Doing inactive"style="font-size: 16px;">Doing</div>
                        <div class="state Done"style="font-size: 16px;">Done</div>
                    </div>
                    <div class="modal-priority">
                        <div class="modpriority Low inactive">Priority Low</div>
                        <div class="modpriority Mid inactive">Priority Mid</div>
                        <div class="modpriority High">Priority High</div>
                    </div>

                    <img  class="close-window" title="Close Window" alter="close button" src="/frontend/resources/icons/remove.svg">
                </div>
                <hr style="border: 1.5px solid #DFD0B8; width: 108.9%; border-radius: 20px;">
                </svg>
            </div>
            <div class="label-title-frame">
                <div class="label-edit-title">
                    <img src="/frontend/resources/icons/title_icon.svg">
                    Title
                </div>
                <textarea autofocus maxlength="60" rows="1" class="edit-modal-text-area title">Titolo provvisorio</textarea>
            </div>

            <div class="label-title-frame">
                <div class="label-edit-title">
                    <img src="/frontend/resources/icons/description.svg">
                    Description
                </div>
                <textarea maxlength="1300" rows="14" class="edit-modal-text-area description">Descrizione Provvisoria</textarea>
            </div>


            <button class="button" id="close-modal" aria-label="close modal">Apply Changes</button>
            <button class="button" id="add-task-modal" aria-label="close modal">Add Task</button>
        </div>
    </dialog>
    
    <dialog id="auditLog-modal">
        <div class="audit-log-frame">
            Audit Log
            <textarea readonly class="audit-log-text-area"></textarea>
        </div>
        

    </dialog>
    <script src="/frontend/javascript/app.js"></script>
</body>
</html>
